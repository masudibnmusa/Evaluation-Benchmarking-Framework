# LLM eval gate: runs the eval suite against the committed baseline and fails
# the check if quality regressed (app.main run --baseline exits 1).
#
# Calls the model API, so it only runs when the ANTHROPIC_API_KEY secret is set
# and the dataset, prompt and baseline files exist. Otherwise it skips with a notice.
# Defaults can be changed with repository variables (Settings -> Variables):
#   EVAL_DATASET, EVAL_PROMPT, EVAL_SCORERS, EVAL_BASELINE, EVAL_MODEL
name: LLM eval gate

on:
  pull_request:
    paths:
      - "prompts/**"
      - "data/test_sets/**"
      - "data/baselines/**"
      - "app/**"
      - "requirements.txt"
  workflow_dispatch:
    inputs:
      dataset:
        description: "Dataset path"
        required: false
      prompt:
        description: "Prompt file or text"
        required: false
      scorers:
        description: "Scorers, e.g. exact_match:0.5,llm_judge:0.5"
        required: false
      baseline:
        description: "Baseline name (data/baselines/<name>.jsonl) or path"
        required: false
      model:
        description: "Model under test (blank = EVAL_DEFAULT_MODEL)"
        required: false

permissions:
  contents: read

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: Eval vs baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DATASET: ${{ inputs.dataset || vars.EVAL_DATASET || 'data/test_sets/my_task.jsonl' }}
      PROMPT: ${{ inputs.prompt || vars.EVAL_PROMPT || 'prompts/v1.txt' }}
      SCORERS: ${{ inputs.scorers || vars.EVAL_SCORERS || 'exact_match' }}
      BASELINE: ${{ inputs.baseline || vars.EVAL_BASELINE || 'my_task' }}
      MODEL: ${{ inputs.model || vars.EVAL_MODEL || '' }}
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v7

      - name: Preflight
        id: preflight
        run: |
          skip() { echo "::notice title=Eval skipped::$1"; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; }
          [ -n "$ANTHROPIC_API_KEY" ] || skip "ANTHROPIC_API_KEY secret is not set (or this is a PR from a fork)."
          [ -f "$DATASET" ] || skip "Dataset not found: $DATASET"
          case "$BASELINE" in
            */*|*.jsonl) baseline_file="$BASELINE" ;;
            *) baseline_file="data/baselines/$BASELINE.jsonl" ;;
          esac
          [ -f "$baseline_file" ] || skip "Baseline not found: $baseline_file (create one with: python -m app.main set-baseline --name $BASELINE)"
          echo "run=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.preflight.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        if: steps.preflight.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Run eval and regression gate
        if: steps.preflight.outputs.run == 'true'
        run: |
          set -o pipefail
          args=(--dataset "$DATASET" --prompt "$PROMPT" --scorers "$SCORERS" --baseline "$BASELINE")
          if [ -n "$MODEL" ]; then args+=(--model "$MODEL"); fi
          python ci/run_eval_suite.py "${args[@]}" | tee eval-report.md

      - name: Publish report to job summary
        if: always() && steps.preflight.outputs.run == 'true'
        run: |
          if [ -f eval-report.md ]; then cat eval-report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload report and run results
        if: always() && steps.preflight.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ github.run_id }}
          path: |
            eval-report.md
            data/results/*.jsonl
          if-no-files-found: ignore
          retention-days: 30
