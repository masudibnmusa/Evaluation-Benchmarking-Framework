      <title id="how-it-works-light-title">How the LLM eval pipeline works</title>
      <desc id="how-it-works-light-desc">A dataset and prompt template feed the task runner; scored outputs become a run record that is printed as a Markdown report, checked by the regression gate against a saved baseline, and saved to the results store that the Streamlit dashboard reads.</desc>
